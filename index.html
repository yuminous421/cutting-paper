<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="原鄉新觸動｜窗花剪紙示範：對摺 5 款（圓形、花瓣、葉片、菱形、愛心）、四摺 3 款、八摺 2 款與六角窗花 2 款，共 12 個圖案，摺紙、畫線、剪下、打開一步一步動畫示範，附 A4 列印版與英／中雙語步驟說明。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>原鄉新觸動｜窗花剪紙示範</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 頂端彩旗＋彩色標題；左邊切割墊舞台、右邊步驟卡；下方是 12 課貼紙牆 */
:root{
  --bg:#fff4e6;
  --dot:#ffdcc6;
  --surface:#ffffff;
  --ink:#3b2b2b;
  --muted:#7a625d;
  --line:#f1d8c6;
  --accent:#ef4b4b;
  --accent-deep:#c43333;
  --accent-ink:#ffffff;
  --accent-soft:#ffe6df;
  --sun:#ffc83d;
  --mint:#38c1a0;
  --sky:#58a8f0;
  --grape:#9b6cf0;
  --mat:#2f9e85;
  --mat-line:rgba(255,255,255,.12);
  --mat-line-strong:rgba(255,255,255,.26);
  --focus:#1f6feb;
  --font-display:"Huninn","jf-openhuninn","Arial Rounded MT Bold","PingFang TC",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221a20; --dot:#2b2127; --surface:#2d2229; --ink:#f6e9e4; --muted:#c7aea8; --line:#4a3740;
    --accent:#ff6464; --accent-deep:#c94444; --accent-ink:#ffffff; --accent-soft:#4a2a2e;
    --mat:#1f7564; --mat-line:rgba(255,255,255,.09); --mat-line-strong:rgba(255,255,255,.2);
    --focus:#6aa5ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221a20; --dot:#2b2127; --surface:#2d2229; --ink:#f6e9e4; --muted:#c7aea8; --line:#4a3740;
  --accent:#ff6464; --accent-deep:#c94444; --accent-ink:#ffffff; --accent-soft:#4a2a2e;
  --mat:#1f7564; --mat-line:rgba(255,255,255,.09); --mat-line-strong:rgba(255,255,255,.2);
  --focus:#6aa5ff; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 2.2px,transparent 2.8px);background-size:28px 28px;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
.bunting{display:flex;height:42px;align-items:center;justify-content:space-between;overflow:hidden;position:relative;padding:6px max(18px,5vw) 0}
.bunting::before{display:none}
.bunting span{flex:none;width:28px;height:28px;background:var(--rosette) center/contain no-repeat;opacity:.26}
.bunting span:nth-child(3n){width:21px;height:21px;opacity:.18}
.bunting span:nth-child(4n){transform:rotate(14deg)}
.bunting span:nth-child(3n+1){transform:rotate(-11deg)}
@media (max-width:600px){ .bunting span:nth-child(n+7){display:none} }
.app{max-width:1240px;margin:0 auto;padding-block:10px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seal{flex:none;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:30px;transform:rotate(-8deg);box-shadow:0 4px 0 var(--accent-deep),inset 0 0 0 4px rgba(255,255,255,.35)}
.brand{flex:1 1 260px;min-width:0}
header h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(30px,5vw,42px);line-height:1.1;letter-spacing:.04em}
header h1 span{display:inline-block}
header h1 span:nth-child(6n+1){color:var(--accent);transform:rotate(-4deg)}
header h1 span:nth-child(6n+2){color:#e89a00;transform:translateY(-3px)}
header h1 span:nth-child(6n+3){color:var(--mint);transform:rotate(3deg)}
header h1 span:nth-child(6n+4){color:var(--sky);transform:translateY(2px)}
header h1 span:nth-child(6n+5){color:var(--grape);transform:rotate(-3deg)}
header h1 span:nth-child(6n+6){color:var(--accent);transform:translateY(-2px)}
header p{margin:4px 0 0;color:var(--muted);font-size:15px}
.modes{display:flex;align-items:center}
.modes .mode-chip{min-height:44px;padding:6px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-size:17px;box-shadow:0 3px 0 var(--accent-deep)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;align-items:start}
@media (max-width:920px){.work{grid-template-columns:minmax(0,1fr)}}
.stage-col{min-width:0;display:flex;justify-content:center}
.stage-wrap{position:relative;width:100%;max-width:min(100%,calc(100vh - 200px));min-width:min(100%,320px);aspect-ratio:1/1;background:var(--mat);border-radius:28px;overflow:hidden;border:6px solid var(--surface);box-shadow:0 6px 0 var(--line)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fsbtn{position:absolute;top:12px;right:12px;min-height:40px;padding:4px 14px;border:none;border-radius:999px;background:rgba(30,20,20,.6);color:#fff;font:inherit;font-size:15px;cursor:pointer}
.fscap,.fsnav{display:none}
.stage-wrap.is-fs{position:fixed;inset:0;z-index:50;width:auto;height:auto;max-width:none;min-width:0;aspect-ratio:auto;border:none;border-radius:0;box-shadow:none}
.stage-wrap:fullscreen{width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;border:none;border-radius:0}
.stage-wrap.is-fs .fscap,.stage-wrap:fullscreen .fscap{display:flex;flex-direction:column;gap:4px;position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:150px;pointer-events:none}
.fscap b{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3.6vw,52px);color:#ffe27a;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.fscap span{font-size:clamp(18px,2.2vw,32px);color:#fff;max-width:28em;text-shadow:0 2px 6px rgba(0,0,0,.5);line-height:1.5}
.stage-wrap.is-fs .fsnav,.stage-wrap:fullscreen .fsnav{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));max-width:720px;margin-left:auto}
.fsnav button{min-height:60px;padding:6px 10px;border:none;border-radius:999px;background:rgba(255,255,255,.92);color:#3b2b2b;font-family:var(--font-display);font-size:22px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.fsnav #fsNext{background:var(--accent);color:#fff}
.stage-wrap.is-fs .hud,.stage-wrap:fullscreen .hud{display:none}
@media (max-width:600px){ .fscap b{font-size:24px} .fscap span{font-size:17px} .stage-wrap.is-fs .fscap{right:120px} .fsnav button{font-size:17px;padding:4px 6px;white-space:nowrap} .stage-wrap.is-fs .fsnav,.stage-wrap:fullscreen .fsnav{gap:8px} }
/* 手機：固定在底部的上一步／下一步 */
.mbar{display:none}
@media (max-width:920px){
  body.lesson-mode .mbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:2px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  body.lesson-mode{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .mbar button{min-height:54px;min-width:84px;padding:4px 12px;white-space:nowrap;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-family:var(--font-display);font-size:19px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
  .mbar #mNext{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-deep)}
  .mbar .mid{min-width:0;text-align:center;line-height:1.25;cursor:pointer;background:none;border:none;color:var(--ink);font:inherit}
  .mbar .mid small{display:block;font-size:13px;color:var(--muted)}
  .mbar .mid b{display:block;font-family:var(--font-display);font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
.hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.hud span{background:rgba(30,20,20,.6);color:#fff;padding:6px 14px;border-radius:999px;font-size:15px;line-height:1.4;max-width:100%}
.hud .tag{font-family:var(--font-display);font-size:16px}
.panel{min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 0 var(--line)}
.panel section{display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:8px}
.gh{margin:0;font-family:var(--font-display);font-weight:400;font-size:24px}
.label{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.lhead{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lnum{font-family:var(--font-display);font-size:15px;background:var(--sun);color:#3b2b2b;padding:2px 12px;border-radius:999px;transform:rotate(-2deg)}
.lhead h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:3px 12px;border-radius:999px;background:var(--bg);border:2px solid var(--line)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--mint);display:inline-block}
.chip.warn i{background:var(--sun)}
.chip.bad i{background:var(--accent)}
.stars{color:#f2a900;letter-spacing:1px}
.seg,.row{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.row button,.ghost{flex:1 1 auto;min-height:46px;padding:8px 14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
.seg button:active,.row button:active,.ghost:active,.navrow button:active,.cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);box-shadow:0 3px 0 var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
.swrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.swrow > span{font-size:14px;color:var(--muted);width:2.6em;flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0;transition:transform .12s}
.swatches button:hover{transform:scale(1.12)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.1)}
.stepcard{background:var(--accent-soft);border:2px dashed var(--accent);border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.sc-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sc-top span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.sc-top b{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.2}
.stepcard p{margin:0;font-size:18px;line-height:1.65}
.stepcard p.tip{font-size:15px;color:var(--muted)}
.navrow{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.navrow button{min-height:56px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:inherit;font-size:16px;font-weight:500;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.steplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.steplist button{width:100%;display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 10px;border:none;border-radius:999px;background:none;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.steplist .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:2px solid currentColor;font-variant-numeric:tabular-nums}
.steplist button.done{color:var(--ink)}
.steplist button.done .n{background:var(--mint);color:#fff;border-color:var(--mint)}
.steplist button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.steplist button[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:#fff}
.cta{min-height:56px;border:none!important;border-radius:999px!important;background:var(--accent)!important;color:var(--accent-ink)!important;font-family:var(--font-display)!important;font-size:20px!important;cursor:pointer;letter-spacing:.06em;box-shadow:0 4px 0 var(--accent-deep)!important}
.ghost{width:100%}
.note{margin:0;font-size:14px;color:var(--muted)}
.library{display:flex;flex-direction:column;gap:14px}
.libhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.libhead h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:30px}
.libhead .cta{padding:0 22px;min-height:50px;font-size:18px!important}
.libfilter{display:flex;flex-wrap:wrap;gap:8px}
.libfilter button{min-height:40px;padding:6px 16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.libfilter button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 0 var(--accent-deep)}
.lib-group{display:flex;flex-direction:column;gap:8px}
.lib-group h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:4px;padding:8px 8px 10px;border:2px solid var(--line);background:var(--surface);border-radius:20px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;box-shadow:0 4px 0 var(--line);transition:transform .15s}
.card:hover{transform:rotate(-2deg) translateY(-3px)}
.card:nth-child(even):hover{transform:rotate(2deg) translateY(-3px)}
.card .th{background:var(--mat);border-radius:14px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.card img{width:88%;aspect-ratio:1;display:block}
.card .cn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card b{font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1.2}
.card .stars{font-size:13px}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
details.notes{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:14px 20px;box-shadow:0 4px 0 var(--line)}
details.notes summary{cursor:pointer;font-family:var(--font-display);font-size:20px}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 24px;margin-top:10px}
.notes-grid h3{margin:0 0 4px;font-size:16px}
.notes-grid p,.notes-grid ul{margin:0;color:var(--muted);font-size:15px;max-width:65ch}
.notes-grid ul{padding-left:1.2em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 20px;border-radius:999px;font-size:15px;z-index:9;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ .card:hover,.card:nth-child(even):hover,.swatches button:hover{transform:none} }

</style>

<div class="bunting" id="bunting" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="seal" aria-hidden="true">剪</div>
    <div class="brand">
      <h1 aria-label="原鄉新觸動"><span>原</span><span>鄉</span><span>新</span><span>觸</span><span>動</span></h1>
    </div>
    <div class="modes"><span class="mode-chip">10 Shapes</span></div>
  </header>

  <main class="work">
    <div class="stage-col">
      <div class="stage-wrap" id="wrap">
        <canvas id="stage" aria-label="剪紙舞台"></canvas>
        <div class="hud"><span id="hint">準備中…</span><span class="tag" id="tag"></span></div>
        <button class="fsbtn" id="fsBtn" aria-label="全螢幕觀看">⛶ 全螢幕</button>
        <div class="fscap" id="fsCap"><b id="fsTitle"></b><span id="fsText"></span></div>
        <div class="fsnav" id="fsNav"><button id="fsPrev" data-en="◀ Back">◀ 上一步</button><button id="fsReplay" data-en="↻ Replay">↻ 再看</button><button id="fsNext">下一步 ▶</button></div>
      </div>
    </div>

    <aside class="panel">
      <section id="lessonPanel">
        <div class="lhead">
          <span class="lnum" id="lNum"></span>
          <h2 id="lName"></h2>
          <div class="meta" id="lMeta"></div>
        </div>
        <div class="group">
          <div class="swrow"><span data-en="Front">正面</span><div class="swatches" data-key="colorA"></div></div>
          <div class="swrow"><span data-en="Back">背面</span><div class="swatches" data-key="colorB"></div></div>
        </div>
        <div class="stepcard" aria-live="polite">
          <div class="sc-top"><span id="scNum"></span><b id="scTitle"></b></div>
          <p id="scText"></p>
          <p class="tip" id="scTip"></p>
        </div>
        <div class="navrow">
          <button id="prevStep" data-en="Back">上一步</button>
          <button id="replayStep" data-en="Replay">再看一次</button>
          <button id="nextStep" class="cta">下一步</button>
        </div>
        <ol class="steplist" id="stepList"></ol>
        <div class="group">
          <span class="label" data-en="Speed">動作速度</span>
          <div class="seg" data-key="speed">
            <button data-v="slow" data-en="Slow">慢</button><button data-v="mid" data-en="Mid">中</button><button data-v="fast" data-en="Fast">快</button>
          </div>
        </div>
        <button class="ghost" id="autoPlay" data-en="Play the whole lesson">從頭自動播放整課</button>
        <button class="ghost" id="lRecord" data-en="Record the lesson (video)">錄下整課過程（影片）</button>
      </section>

    </aside>
  </main>

  <section class="library" id="library">
    <div class="libhead"><h2>10 Shapes</h2></div>
    <div class="libfilter" id="libFilter" role="group" aria-label="Filter by fold count">
      <button data-fold="all" aria-pressed="true">All</button>
      <button data-fold="2">1 fold</button>
      <button data-fold="4">2 folds</button>
      <button data-fold="8">3 folds</button>
    </div>
  </section>

</div>
<nav class="mbar" id="mbar" aria-label="步驟切換">
  <button id="mPrev" data-en="◀ Back">◀ 上一步</button>
  <button class="mid" id="mMid" aria-label="再看一次這一步"><small id="mNum"></small><b id="mTitle"></b></button>
  <button id="mNext">下一步 ▶</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {

const R = 500, P = 1000, D2R = Math.PI / 180;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function rosetteUrl(color){
  let p = '';
  for (let i=0;i<12;i++) p += `<g transform="rotate(${i*30} 50 50)"><path d="M50 50C43 36 43 20 50 7c7 13 7 29 0 43z" fill="none" stroke="${color}" stroke-width="2.2"/></g>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${p}<circle cx="50" cy="50" r="9" fill="none" stroke="${color}" stroke-width="2.2"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function paintRosette(){
  const cs = getComputedStyle(document.documentElement);
  const accent = (cs.getPropertyValue('--accent') || '#d94b7b').trim() || '#d94b7b';
  document.documentElement.style.setProperty('--rosette', rosetteUrl(accent));
}

const mul = (A,B) => ({a:A.a*B.a+A.c*B.b, b:A.b*B.a+A.d*B.b, c:A.a*B.c+A.c*B.d, d:A.b*B.c+A.d*B.d});

  return {a:1-k*nx*nx, b:-k*nx*ny, c:-k*nx*ny, d:1-k*ny*ny}; };

function buildLayers(fold){
  let all = [I], last = [I]; const steps = [];
  for (const s of FOLDS[fold].steps){
    const src = s.src === 'last' ? last : all.slice();
    const ref = reflect(s.axis), made = src.map(m => mul(ref, m));
    steps.push({axis:s.axis, src, made});
    all = all.concat(made); last = made;
  }
  return {steps, all};
}

/* ---------- 形狀 ---------- */
const ring = (n,f) => { const a = []; for (let i=0;i<n;i++) a.push(f(2*Math.PI*i/n)); return a; };
function moonPts(){
  const cx=.45, cy=-.15, r2=.85, phi=Math.atan2(cy,cx), cl=Math.hypot(cx,cy);
  const beta = Math.acos(((1+cl*cl-r2*r2)/2)/cl), n=40, pts=[];
  for (let i=0;i<=n;i++){ const a = phi+beta+(2*Math.PI-2*beta)*i/n; pts.push([Math.cos(a),Math.sin(a)]); }
  const p1=[Math.cos(phi+beta),Math.sin(phi+beta)], p2=[Math.cos(phi-beta),Math.sin(phi-beta)];
  const g2=Math.atan2(p2[1]-cy,p2[0]-cx), g1=Math.atan2(p1[1]-cy,p1[0]-cx);
  let d=g1-g2; while(d<0) d+=2*Math.PI;
  const mid=g2+d/2, target=phi+Math.PI;
  if (Math.abs(Math.atan2(Math.sin(mid-target),Math.cos(mid-target))) > Math.PI/2) d -= 2*Math.PI;
  for (let i=1;i<n;i++){ const a=g2+d*i/n; pts.push([cx+r2*Math.cos(a), cy+r2*Math.sin(a)]); }
  return pts.map(([x,y])=>[x+.15,y]);
}

const SHAPES = {
  circle:  {name:'圓形', en:'Circle', pts: ring(48,t=>[Math.cos(t),Math.sin(t)])},
  flower:  {name:'花瓣', en:'Flower', pts: ring(120,t=>{const r=.5+.5*Math.abs(Math.cos(2.5*(t+Math.PI/2))); return [r*Math.cos(t), r*Math.sin(t)];})},
  leaf:    {name:'葉片', en:'Leaf', pts: ring(60,t=>[.55*Math.sin(t)*Math.abs(Math.sin(t)), -Math.cos(t)])},
  diamond: {name:'菱形', en:'Diamond', pts: [[0,-1],[.6,0],[0,1],[-.6,0]]},
  heart:   {name:'愛心', en:'Heart', pts: ring(72,t=>[Math.pow(Math.sin(t),3), -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16-.15])}
};
function stampPoly(shape,x,y,size,rot=0){
  const c=Math.cos(rot*D2R), s=Math.sin(rot*D2R), out=[];
  for (const [px,py] of SHAPES[shape].pts) out.push(x+(px*c-py*s)*size, y+(px*s+py*c)*size);
  return out;
}
const rect = (x0,y0,x1,y1) => [x0,y0,x1,y0,x1,y1,x0,y1];
const pol = (r,deg) => [r*Math.cos(deg*D2R), r*Math.sin(deg*D2R)];

const circ = (p,r) => stampPoly('circle',p[0],p[1],r);
function ellipse(cx,cy,rx,ry,rot,n=64){ const c=Math.cos(rot*D2R), s=Math.sin(rot*D2R), o=[];
  for(let i=0;i<n;i++){const t=2*Math.PI*i/n, x=rx*Math.cos(t), y=ry*Math.sin(t); o.push(cx+x*c-y*s, cy+x*s+y*c);} return o; }
function strip(p0,p1,p2,w,n=24){ const L=[],Rr=[];
  for(let i=0;i<=n;i++){const t=i/n, mt=1-t;
    const x=mt*mt*p0[0]+2*mt*t*p1[0]+t*t*p2[0], y=mt*mt*p0[1]+2*mt*t*p1[1]+t*t*p2[1];
    const dx=2*mt*(p1[0]-p0[0])+2*t*(p2[0]-p1[0]), dy=2*mt*(p1[1]-p0[1])+2*t*(p2[1]-p1[1]), l=Math.hypot(dx,dy)||1;
    L.push([x-dy/l*w/2, y+dx/l*w/2]); Rr.push([x+dy/l*w/2, y-dx/l*w/2]);}
  return L.concat(Rr.reverse()).flat(); }

  const th = L.steps[stepK].axis*D2R;
  for (const sgn of [1,-1]){
    const dx = sgn*Math.cos(th), dy = sgn*Math.sin(th), nx = -dy*8, ny = dx*8;
    if (!(inRegion(dx*R*.5+nx, dy*R*.5+ny, stat) || inRegion(dx*R*.5-nx, dy*R*.5-ny, stat))) continue;
    const r = radiusAt(Math.atan2(dy,dx));
    dashedLine(ctx, T.ox, T.oy, T.ox+dx*r*T.s, T.oy+dy*r*T.s, '#ffe27a');
  }
}
function wrapText(ctx, text, maxW){ const lines=[]; let line='';
  for (const ch of text){ if (ctx.measureText(line+ch).width > maxW && line){ lines.push(line); line=ch; } else line+=ch; }
  if (line) lines.push(line); return lines; }
function drawCaption(ctx){
  if (!caption) return;
  const W = stage.width, H = stage.height, pad = 22*dpr;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.font = `400 ${20*dpr}px ${fontBody()}`;
  const lines = wrapText(ctx, caption.text, W-2*pad);
  const bh = pad*1.6 + 34*dpr + lines.length*30*dpr;
  ctx.fillStyle='rgba(10,20,15,.72)'; ctx.fillRect(0,H-bh,W,bh);
  ctx.fillStyle='#ffe27a'; ctx.font = `${28*dpr}px "Huninn","Noto Sans TC",sans-serif`; ctx.textBaseline='top';
  ctx.fillText(caption.title, pad, H-bh+pad*.8);
  ctx.fillStyle='#fff'; ctx.font = `400 ${20*dpr}px ${fontBody()}`;
  lines.forEach((l,i)=>ctx.fillText(l, pad, H-bh+pad*.8+40*dpr+i*30*dpr));
  ctx.fillStyle='rgba(255,255,255,.8)'; ctx.font = `500 ${15*dpr}px ${fontBody()}`; ctx.textAlign='right';
  ctx.fillText(caption.corner || '', W-pad, pad);

}
/* ---------- 動畫工具 ---------- */
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const spd = () => ({slow:1.6, mid:1, fast:.55})[S.speed] * (reduced ? .15 : 1);
function tween(ms, fn, tok){
  return new Promise(res => {
    const t0 = performance.now(), dur = Math.max(1, ms);
    const f = now => { if (tok !== animToken){ res(false); return; }
      const t = Math.min(1,(now-t0)/dur); fn(t); render(); if (t<1) requestAnimationFrame(f); else res(true); };
    requestAnimationFrame(f);
  });
}
const wait = (ms, tok) => tween(ms*spd(), ()=>{}, tok);

let rq = false;
function requestRender(){ if (!rq){ rq = true; requestAnimationFrame(render); } }

  const cv = mk(P), c = cv.getContext('2d'); c.drawImage(prev,0,0); c.globalCompositeOperation='destination-out'; c.drawImage(WY,0,0);
  if (reduced) return;

}
async function foldOne(i, tok){ // 第 i 摺（依摺的順序）
  const N = L.steps.length, k = N-1-i;
  u = N-i; hiFold = k; render();

}

async function flipShow(tok, label){

const dlReady = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);
async function saveFile(name, blob){
  const dl = await dlReady;
  if (dl){
    try { await dl.save({filename:name, data:blob}); toast(T('已存檔：','Saved: ')+name); }
    catch(e){ if (e && e.code === 'declined') return; toast(T('這個畫面無法存檔，請改用瀏覽器開啟這頁再試','This view cannot save files. Open the page in a browser and try again.')); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast(T('已下載：','Downloaded: ')+name);
}

function inRegionF(fold, x, y, mats){ const [d1,d2] = FOLDS[fold].wedge;

  return false; }
function foldRays(fold){
  const Ls = buildLayers(fold), N = Ls.steps.length, out = [];
  for (let i=0;i<N;i++){
    const k = N-1-i, stat = [I]; for (let j=0;j<=k;j++) stat.push(...Ls.steps[j].made);
    const th = Ls.steps[k].axis*D2R, rays = [];
    for (const sgn of [1,-1]){ const dx=sgn*Math.cos(th), dy=sgn*Math.sin(th), nx=-dy*8, ny=dx*8;

let pdfBusy = false;
async function buildPdf(sheets, withCover, name){
  if (pdfBusy) return;
  if (!window.jspdf){ toast('PDF 工具還在載入，請稍等幾秒再按一次'); return; }
  pdfBusy = true;
  try {
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true}); let first = true;
    const add = cv => { if (!first) pdf.addPage(); first = false; pdf.addImage(cv.toDataURL('image/jpeg', .93), 'JPEG', 0, 0, 210, 297); };
    if (withCover){ toast('製作封面中…'); add(await makeCover()); }
    for (let i=0;i<sheets.length;i++){
      if (sheets.length > 1) toast(`製作中 ${i+1} / ${sheets.length}…`);
      add(await makeSheet(sheets[i])); await new Promise(r => setTimeout(r, 0));
    }
    await saveFile(name, pdf.output('blob'));
  } catch(e){ toast('PDF 做不出來，請重新整理頁面再試一次'); }
  pdfBusy = false;
}

async function recordWith(runner, name){
  if (!window.MediaRecorder || !stage.captureStream){ toast('這個瀏覽器不支援錄影，請改用 Chrome 或 Safari'); return; }
  const types = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)); if (!mime){ toast('這個瀏覽器不支援錄影'); return; }
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  cancelAnim(); const tok = ++animToken;
  const rec = new MediaRecorder(stage.captureStream(30), {mimeType:mime, videoBitsPerSecond:6e6}), chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  recording = true; busy = true; updateUI(); toast('錄影中，播完會自動存檔');
  rec.start();
  const ok = await runner(tok);
  if (ok) await tween(1200, ()=>{}, tok);
  rec.stop(); await stopped; recording = false; busy = false; caption = null; updateUI(); render();
  if (ok) saveFile(`${name}.${ext}`, new Blob(chunks, {type:mime})); else toast('錄影中斷了');
}

$('#nextStep').onclick = () => { if (S.lstep >= lessonSteps.length-1) loadLesson((S.lesson+1)%LESSONS.length); else runLessonStep(S.lstep+1); };
$('#replayStep').onclick = () => runLessonStep(S.lstep);
$('#autoPlay').onclick = async () => { cancelAnim(); const tok = ++animToken; busy = true; updateUI(); await playAll(tok, false); if (tok===animToken){ busy=false; updateUI(); render(); } };
const a4All2 = $('#a4All2');
if (a4All2) a4All2.onclick = () => buildPdf(LESSONS.map((_,i)=>lessonSheet(i)), true, `對摺剪紙_${LESSONS.length}課A4練習本.pdf`);
$('#lRecord').onclick = () => recordWith(tok => playAll(tok, true), `剪紙教學_第${S.lesson+1}課_${LESSONS[S.lesson].name}`);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && wrapEl.classList.contains('is-fs')){ toggleFs(); return; }
  if (isFs() && S.mode==='lesson' && (e.key==='ArrowRight' || e.key===' ')){ e.preventDefault(); $('#nextStep').click(); return; }
  if (isFs() && S.mode==='lesson' && e.key==='ArrowLeft'){ $('#prevStep').click(); return; }
  if (e.target === document.body){
    if (e.key === 'ArrowRight') $('#nextStep').click();
    if (e.key === 'ArrowLeft') $('#prevStep').click();
  }
});

/* 全螢幕：投影、電視大螢幕觀看 */
const wrapEl = $('#wrap');
function isFs(){ return document.fullscreenElement === wrapEl || document.webkitFullscreenElement === wrapEl || wrapEl.classList.contains('is-fs'); }
async function toggleFs(){
  if (isFs()){
    if (document.fullscreenElement || document.webkitFullscreenElement){ try { await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); } catch(e){} }
    wrapEl.classList.remove('is-fs');
  } else {
    const req = wrapEl.requestFullscreen || wrapEl.webkitRequestFullscreen;
    try { if (!req) throw 0; await req.call(wrapEl); } catch(e){ wrapEl.classList.add('is-fs'); }
  }
  setTimeout(() => { resize(); updateUI(); }, 60);
}
$('#fsBtn').onclick = toggleFs;
document.addEventListener('fullscreenchange', () => { resize(); updateUI(); });
document.addEventListener('webkitfullscreenchange', () => { resize(); updateUI(); });
$('#mPrev').onclick = () => $('#prevStep').click();
$('#mNext').onclick = () => $('#nextStep').click();
$('#mMid').onclick = () => $('#replayStep').click();
/* 教案模式：在動畫上左右滑動換步驟 */
{ let sx = null, sy = null;
  stage.addEventListener('pointerdown', e => { if (S.mode==='lesson'){ sx = e.clientX; sy = e.clientY; } });
  stage.addEventListener('pointerup', e => { if (S.mode!=='lesson' || sx===null) return; const dx = e.clientX-sx, dy = e.clientY-sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3) (dx < 0 ? $('#nextStep') : $('#prevStep')).click(); }); }
$('#fsPrev').onclick = () => $('#prevStep').click();
$('#fsNext').onclick = () => $('#nextStep').click();
$('#fsReplay').onclick = () => $('#replayStep').click();
function updateHint(){
  let h = '';
  if (hudMsg) h = hudMsg;
  else if (recording) h = T('錄影中，請稍候…','Recording, please wait…');
  else if (S.mode === 'lesson'){ const s = lessonSteps[S.lstep]; h = s ? T(`步驟 ${S.lstep+1}：${s.title}${busy ? '…' : ''}`, `Step ${S.lstep+1}: ${s.titleEn || s.title}${busy ? '…' : ''}`) : ''; }
  $('#hint').textContent = h;
}
function updateUI(){
  for (const el of $$('.seg[data-key]')) el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S[el.dataset.key])));
  for (const el of $$('.swatches[data-key]')) el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S[el.dataset.key])));
  {
    const les = LESSONS[S.lesson], s = lessonSteps[S.lstep];
    $('#lNum').textContent = T(`第 ${S.lesson+1} / ${LESSONS.length}`, `Shape ${S.lesson+1} of ${LESSONS.length}`);
    $('#lName').textContent = T(les.name, les.nameEn);
    $('#lMeta').innerHTML = `<span class="chip"><span class="stars">${stars(les.level)}</span></span><span class="chip">${T(`${FOLDS[les.fold].name}・${L.all.length} 份`, `${FOLDS[les.fold].en} · ${L.all.length} copies`)}</span><span class="chip">${les.shape==='circle'?T('圓形紙','Round paper'):T('正方形紙','Square paper')}</span><span class="chip">${T(les.theme, les.themeEn)}</span>`;
    if (s){ $('#scNum').textContent = `步驟 ${S.lstep+1} / ${lessonSteps.length}`;
      $('#scTitle').textContent = s.title;
      $('#scText').textContent = s.text;
      $('#scTip').textContent = s.tip || ''; $('#scTip').hidden = !(s.tip || s.tipEn); }
    $$('#stepList button').forEach((b,i) => { b.classList.toggle('done', i < S.lstep); if (i===S.lstep) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); b.disabled = recording; });
    $('#prevStep').disabled = S.lstep === 0 || recording;
    $('#nextStep').textContent = S.lstep >= lessonSteps.length-1 ? T('下一個','Next shape') : T('下一步','Next step');
    for (const id of ['#nextStep','#replayStep','#autoPlay','#lRecord']) $(id).disabled = recording;
    $$('.card').forEach(c => c.setAttribute('aria-current', String(+c.dataset.i === S.lesson)));
    stage.style.cursor = 'default';
  }
  { const fs = isFs(), s = lessonSteps[S.lstep];
    $('#fsBtn').textContent = fs ? T('✕ 離開全螢幕','✕ Exit full screen') : T('⛶ 全螢幕','⛶ Full screen');
    $('#fsTitle').textContent = s ? `${S.lstep+1}. ${T(s.title, s.titleEn || s.title)}` : '';
    $('#fsText').textContent = s ? T(s.text, s.textEn || s.text) : '';
    $('#fsNext').textContent = S.lstep >= lessonSteps.length-1 ? T('下一個 ▶','Next shape ▶') : T('下一步 ▶','Next step ▶');
    $('#fsPrev').disabled = $('#mPrev').disabled = S.lstep === 0 || recording;
    document.body.classList.toggle('lesson-mode', S.mode==='lesson' && !fs);
    $('#mNum').textContent = s ? T(`步驟 ${S.lstep+1}/${lessonSteps.length}・點我重看`, `Step ${S.lstep+1}/${lessonSteps.length} · tap to replay`) : '';
    $('#mTitle').textContent = s ? T(s.title, s.titleEn || s.title) : '';
    $('#mNext').textContent = S.lstep >= lessonSteps.length-1 ? T('下一個 ▶','Next shape ▶') : T('下一步 ▶','Next step ▶'); }
  $('#tag').textContent = T(`${FOLDS[S.fold].name}・${L.all.length} 份`, `${FOLDS[S.fold].en} · ${L.all.length} copies`);
  updateHint();
}
let toastTimer;
function applyLang(){
  document.documentElement.lang = isZH() ? 'zh-Hant' : 'en';
  $$('[data-en]').forEach(el => {
    if (!el.hasAttribute('data-zh')) el.setAttribute('data-zh', el.textContent.trim());
    el.textContent = isZH() ? el.getAttribute('data-zh') : el.getAttribute('data-en');
  });
  renderLibrary(); renderStepList(); updateUI();
}

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; t.style.opacity = '1'; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.hidden = true, 300); }, 2800); }

function resize(){
  const r = $('#wrap').getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(10, Math.round(r.width*dpr)), h = Math.max(10, Math.round(r.height*dpr));
  if (stage.width !== w || stage.height !== h){ stage.width = A.width = B.width = w; stage.height = A.height = B.height = h; }
  render();
}
new ResizeObserver(resize).observe($('#wrap'));
const retheme = () => { readTokens(); paintRosette(); render(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

{ const b = $('#bunting'); for (let i=0;i<9;i++) b.appendChild(document.createElement('span')); }
readTokens();
paintRosette();
loadLesson(0, false);
applyLang();
resize();
setTimeout(() => runLessonStep(0), 300);
})();
</script>

</body>
</html>
